aid: istante
name: Istante
description: Istante is an Italian technology company (VAT IT03635230547, based in
  the Perugia area) that develops and operates Athena, a business-process-automation
  platform built around a team of specialized AI assistants. Athena covers assistants
  for communication routing and email classification, credit management and collections,
  a 24/7 voice/phone assistant, quote and order processing, automated tender monitoring
  and scoring, outbound lead engagement, contract and legal analysis, and HR and
  onboarding. It is positioned to collaborate with staff rather than replace them,
  keeping critical decisions under human oversight, and is offered on a fixed-cost
  "Digital Working Units" (DWU) pricing model rather than variable token pricing. The
  platform integrates across email, Microsoft Teams, WhatsApp, SMS, and phone, and
  is presented as GDPR and EU AI Act compliant. Istante was surfaced as a portfolio
  company of Canaan Partners and added to the API Evangelist network for enrichment.
